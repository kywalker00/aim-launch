<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Launching KovaaK's…</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: Lexend, system-ui, sans-serif;
         background: radial-gradient(circle at 30% 20%, #3b0764, #111827 60%); color: #f9fafb; }
  .card { text-align: center; padding: 40px 48px; border-radius: 20px; background: rgba(17,24,39,.75);
          border: 1px solid #374151; max-width: 440px; }
  h1 { font-size: 15px; letter-spacing: .12em; text-transform: uppercase; color: #c084fc; margin: 0 0 12px; }
  .name { font-size: 26px; font-weight: 700; margin: 0 0 24px; word-break: break-word; }
  a.btn { display: inline-block; padding: 14px 28px; border-radius: 12px; background: #7c3aed; color: #fff;
          font-weight: 600; text-decoration: none; }
  a.btn:hover { background: #6d28d9; }
  p.hint { color: #9ca3af; font-size: 13px; margin: 20px 0 0; line-height: 1.5; }
</style>
</head>
<body>
<div class="card">
  <h1>🎯 Aim Grades · launching</h1>
  <p class="name" id="name">KovaaK's</p>
  <a class="btn" id="go" href="#">▶ Play in KovaaK's</a>
  <p class="hint">If Steam didn't open, click the button.<br>Your browser may ask to open Steam. Allow it.</p>
</div>
<script>
  // Builds the Steam deep link for a KovaaK's scenario from ?s=<scenario name>. No accounts, no tracking.
  var name = new URLSearchParams(location.search).get('s') || '';
  var url = 'steam://run/824270/?action=jump-to-scenario;name=' + encodeURIComponent(name) + ';mode=challenge';
  if (!name) url = 'steam://run/824270';
  document.getElementById('name').textContent = name || "KovaaK's";
  document.title = name ? '▶ ' + name : "KovaaK's";
  document.getElementById('go').href = url;
  setTimeout(function () { location.href = url; }, 150);
</script>
</body>
</html>
