<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🔄 Refreshing…</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: Lexend, system-ui, sans-serif;
         background: radial-gradient(circle at 30% 20%, #3b0764, #111827 60%); color: #f9fafb; }
  .card { text-align: center; padding: 40px 48px; border-radius: 20px; background: rgba(17,24,39,.75);
          border: 1px solid #374151; max-width: 440px; }
  h1 { font-size: 15px; letter-spacing: .12em; text-transform: uppercase; color: #c084fc; margin: 0 0 12px; }
  .big { font-size: 48px; margin: 0 0 8px; }
  .msg { font-size: 22px; font-weight: 700; margin: 0 0 12px; }
  p.hint { color: #9ca3af; font-size: 13px; margin: 8px 0 0; line-height: 1.5; }
  .spin { display: inline-block; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="card">
  <h1>🎯 Aim Grades · refresh</h1>
  <p class="big"><span id="icon" class="spin">🔄</span></p>
  <p class="msg" id="msg">Pulling everyone's latest scores…</p>
  <p class="hint" id="hint">This takes about 30–60 seconds. Keep this tab open.</p>
</div>
<script>
  // Asks the Aim Grades script to refresh every player's scores. credentials:'omit' sends no Google login,
  // so it works the same whether the viewer is signed into zero, one or several Google accounts.
  var EXEC = 'https://script.google.com/macros/s/AKfycbxcSz2yP7g3B1hMw5URCgvG_t_uw2pZvdx-W7RC9XTQSxcbmgF1Vwq587OxJwmqonVCwA/exec';
  var icon = document.getElementById('icon'), msg = document.getElementById('msg'), hint = document.getElementById('hint');
  function done(text, sub, emoji) {
    icon.classList.remove('spin'); icon.textContent = emoji; msg.textContent = text; hint.textContent = sub;
    document.title = emoji + ' ' + text;
  }
  fetch(EXEC + '?refresh=1&api=1', { credentials: 'omit', redirect: 'follow' })
    .then(function (r) { return r.json(); })
    .then(function (j) {
      var cooldown = /^Already/.test(j.msg || '');
      done(cooldown ? 'Just refreshed' : 'Scores are up to date', cooldown ? j.msg : 'Switch back to the sheet. You can close this tab.', cooldown ? '⏳' : '✅');
    })
    .catch(function () {
      // If the reply can't be read, still send the request so the refresh happens.
      fetch(EXEC + '?refresh=1', { mode: 'no-cors', credentials: 'omit' }).finally(function () {
        done('Refresh sent', 'Give it about a minute, then check the sheet.', '🔄');
      });
    });
</script>
</body>
</html>
